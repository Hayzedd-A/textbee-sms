# nginx server block for the self-hosted TextBee instance.
# Place at /etc/nginx/sites-available/textbee.conf on the droplet, then:
#   ln -s /etc/nginx/sites-available/textbee.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Run `certbot --nginx -d sms.yourdomain.com` once this is enabled to provision HTTPS;
# certbot will rewrite this file to add the ssl_certificate lines and the :443 block.

upstream textbee_api {
    server 127.0.0.1:3001;
}

upstream textbee_web {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name sms.yourdomain.com;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://textbee_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://textbee_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
